# Security headers for the triage site. The app is static: every script and style is served from this
# site, so nothing else is allowed to run. The only outside request is the EM Evidence logo image.
# 'unsafe-inline' is for style attributes only; scripts must come from files (see boot.js).
# tests/e2e.mjs serves the app with this same policy, so a change that breaks it fails the tests.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self' https://emevidence.org https://www.emevidence.org"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self), payment=(), usb=()"
